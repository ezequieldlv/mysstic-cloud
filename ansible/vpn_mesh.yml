---
- name: Despliegue de Red Híbrida Edge-to-Cloud (Tailscale)
  hosts: aws_production
  become: yes

  tasks:
    - name: Descargar e instalar Tailscale
      ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Asegurar servicio activo
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: yes

    - name: Autenticar en la Red Mesh
      ansible.builtin.command: tailscale up --authkey={{ tailscale_auth_key }} --accept-dns=false --ssh
      register: tailscale_auth
      changed_when: "'Success' in tailscale_auth.stdout"
      failed_when: 
        - tailscale_auth.rc != 0
        - "'already authorized' not in tailscale_auth.stderr"

    - name: Permitir tráfico en la VPN
      ansible.builtin.ufw:
        rule: allow
        interface: tailscale0
        direction: in