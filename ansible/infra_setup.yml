---
- name: Aprovisionamiento de Infraestructura Base (Docker + UFW)
  hosts: aws_production
  become: yes 

  tasks:
    - name: Configurar UFW para permitir puertos esenciales
      ansible.builtin.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"   
        - "80"  
        - "443" 

    - name: Activar UFW y denegar todo el tráfico entrante por defecto
      ansible.builtin.ufw:
        state: enabled
        default: deny

    - name: Instalar dependencias previas para Docker
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Agregar la clave GPG oficial de Docker
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Agregar el repositorio oficial de Docker
      ansible.builtin.apt_repository:
        repo: "deb https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present

    - name: Instalar Docker Engine y Docker Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    # ==========================================
    - name: Asegurar que el servicio de Docker arranque automáticamente
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Agregar el usuario 'admin' al grupo 'docker'
      ansible.builtin.user:
        name: admin
        groups: docker
        append: yes