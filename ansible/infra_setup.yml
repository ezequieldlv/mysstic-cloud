---
- name: Aprovisionamiento de Infraestructura Base (Docker + UFW)
  hosts: aws_production
  become: yes # Ejecutar todo como root (sudo)

  tasks:
    # ==========================================
    # BLOQUE 1: BLINDAJE DE RED (ZERO TRUST BASE)
    # ==========================================
    - name: Configurar UFW para permitir puertos web publicos
      ansible.builtin.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"   # HTTP
        - "443"  # HTTPS

    - name: ZERO TRUST - Permitir acceso total desde la VLAN de Tailscale
      ansible.builtin.ufw:
        rule: allow
        interface: tailscale0
        direction: in

    - name: Activar UFW y denegar todo el trafico entrante por defecto
      ansible.builtin.ufw:
        state: enabled
        default: deny

    # ==========================================
    # BLOQUE 2: INSTALACIÓN DE DOCKER (ESTÁNDAR SEGURO)
    # ==========================================
    - name: Instalar dependencias previas para Docker
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Crear directorio para keyrings de APT (Seguridad Moderna)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Descargar clave GPG oficial de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Obtener arquitectura del sistema (amd64 o arm64)
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Agregar el repositorio oficial de Docker con firma aislada
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Instalar Docker Engine y Plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    # ==========================================
    # BLOQUE 3: CONFIGURACIÓN DE SERVICIOS Y PERMISOS
    # ==========================================
    - name: Asegurar que el servicio de Docker arranque automáticamente
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Agregar el usuario 'admin' al grupo 'docker'
      ansible.builtin.user:
        name: admin
        groups: docker
        append: yes