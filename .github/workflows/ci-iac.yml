name: CI SecOps - MyssTic Cloud IaC

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write   
  contents: read    

jobs:
  # =====================================================================
  # FASE CI: SEGURIDAD Y AUDITORÍA
  # =====================================================================
  security-and-linting:
    name: Escaneo Zero-Trust y Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Clonar el repositorio
        uses: actions/checkout@v4

      - name: 2. Autenticación Zero-Trust en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::528733131843:role/mysstic-github-actions-role
          aws-region: us-east-2

      - name: 3. Escaneo de Secretos (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

      - name: 4. Auditoría IaC (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false

  # =====================================================================
  # FASE CD: DESPLIEGUE CONTINUO
  # =====================================================================
  cd-deploy:
    name: 🚀 Despliegue Automático (Terraform + Ansible)
    runs-on: ubuntu-latest
    needs: security-and-linting
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 1. Clonar el repositorio
        uses: actions/checkout@v4

      - name: 2. Autenticación Zero-Trust en AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::528733131843:role/mysstic-github-actions-role
          aws-region: us-east-2

      - name: 3. Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 4. Terraform Init & Apply (Infraestructura inmutable)
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve
          
      - name: 5. Extraer Tailscale Auth Key de AWS Secrets Manager
        id: fetch-ts-key
        run: |
          TS_KEY=$(aws secretsmanager get-secret-value --secret-id mysstic-core-secrets --query SecretString --output text | jq -r .tailscale_auth_key)
          echo "::add-mask::$TS_KEY"
          echo "TS_AUTHKEY=$TS_KEY" >> $GITHUB_ENV

      - name: 6. Conectar GitHub Runner a VPN Tailscale Zero-Trust
        uses: tailscale/github-action@v2
        with:
          version: 'latest'
          oauth-client-id: "" 
          oauth-secret: "" 
          authkey: ${{ env.TS_AUTHKEY }}
          tags: tag:prod

      - name: 7. Esperar inicialización del SO (Evitar Race Condition)
        run: |
          echo "Terraform terminó, pero Linux y Tailscale en la EC2 siguen instalándose."
          echo "Esperando 90 segundos para que MagicDNS propague el hostname..."
          sleep 90

      - name: 8. Ejecutar Ansible Playbook vía Tailscale SSH
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i ansible/inventory/aws_ec2.yml ansible/site.yml